name: Skill CI and Release

'on':
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (first patch publication uses the declared base version)
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate skill and version
        run: python scripts/build_skill.py --check
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify standalone ZIP
        run: python scripts/build_skill.py --output dist
      - name: Upload CI package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-${{ runner.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Version and publish
    needs: test
    if: >-
      github.repository == 'isunky/TeslaSkin' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: teslaskin-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare version, commit, tag and package
        id: prepare
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: python scripts/release_skill.py --bump "$BUMP"
      - name: Publish GitHub Release (safe to retry)
        if: steps.prepare.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package="dist/tesla-skin-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            verify_dir="${RUNNER_TEMP}/teslaskin-verify-${TAG}"
            mkdir -p "$verify_dir"
            for file in "$package" dist/SHA256SUMS.txt; do
              filename="$(basename "$file")"
              if gh release download "$TAG" --pattern "$filename" --dir "$verify_dir"; then
                cmp "$file" "$verify_dir/$filename"
              else
                gh release upload "$TAG" "$file"
              fi
            done
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "$package" dist/SHA256SUMS.txt --verify-tag \
              --title "TeslaSkin Skill ${TAG}" --generate-notes --notes-file dist/release-notes.md
          fi
          printf '## Published %s\n\n[Download release](https://github.com/%s/releases/tag/%s)\n' "$TAG" "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload versioned build
        if: steps.prepare.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.prepare.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
